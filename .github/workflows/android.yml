name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest
      - name: Gerar APK debug
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: mapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Publica o APK numa release "ultima-versao" para baixar direto no celular.
      - name: Publicar APK na release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MApp.apk
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao MApp.apk \
            --title "MApp – última versão (${GITHUB_SHA::7})" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}." \
            --prerelease
